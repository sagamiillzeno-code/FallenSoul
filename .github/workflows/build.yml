
name: Build FallenSoul

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle.zip

      - name: Build FallenSoul
        run: ./gradle-4.9/bin/gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FallenSoul-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
