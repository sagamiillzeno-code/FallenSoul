
name: Build FallenSoul

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          set -e
          curl -L --fail \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Download Forge userdev3
        run: |
          set -e
          mkdir -p libs
          curl -L --fail \
            -o libs/forge-userdev3.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-userdev3.jar

      - name: Build FallenSoul
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FallenSoul-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
          
